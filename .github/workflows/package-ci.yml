name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      drift:
        description: Check source and dependency drift
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule' && !inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@c811fd3f70c662e0a5c425387a1f9688687763a4
    with:
      tooling_ref: c811fd3f70c662e0a5c425387a1f9688687763a4
      paired_scan: true
  drift:
    if: github.event_name == 'schedule' || inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@ef3f23009b189a210ecbf2c7f2d6d218abb95adc
    with:
      tooling_ref: ef3f23009b189a210ecbf2c7f2d6d218abb95adc
      drift: true
